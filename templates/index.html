<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>धरोहर सेतु — AI Cultural Heritage & Folk Radar</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Rozha+One&family=Yatra+One&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --maroon: #7B1E1E;
      --gold: #C9A84C;
      --dark-gold: #9B7A2F;
      --cream: #FDF6E9;
      --parchment: #F5ECD7;
      --sidebar-width: 300px;
      --story-width: 380px;
      --nav-height: 54px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--cream);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .font-royal { font-family: 'Rozha One', serif; }
    .font-hindi { font-family: 'Yatra One', cursive; }

    /* ====== NAVBAR ====== */
    #navbar {
      height: var(--nav-height);
      background: linear-gradient(90deg, #2C1010 0%, #5C2020 40%, #8B3A1A 100%);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .nav-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFD700, #C09030);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 10px rgba(255,215,0,0.5);
    }

    .nav-title { color: #FFE680; font-family: 'Rozha One', serif; font-size: 1.2rem; line-height: 1.1; }
    .nav-subtitle { color: rgba(255,220,100,0.7); font-size: 9px; letter-spacing: 0.5px; }

    .nav-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .mode-pill {
      display: flex;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,230,160,0.8);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: var(--gold);
      color: #2C1010;
      box-shadow: 0 2px 6px rgba(201,168,76,0.5);
    }

    .mode-btn:hover:not(.active) { background: rgba(255,255,255,0.1); color: #FFE680; }

    .fest-btn {
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      color: #2C1010;
      background: linear-gradient(135deg, #FFD700, #C09030);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fest-btn:hover { opacity: 0.9; transform: scale(1.02); }

    #state-select {
      background: rgba(0,0,0,0.4);
      color: #FFE680;
      border: 1px solid rgba(201,168,76,0.5);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 160px;
    }

    #state-select option { background: #2C1010; color: #FFE680; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .nav-btn {
      padding: 5px 12px;
      border-radius: 10px;
      border: 1px solid rgba(201,168,76,0.4);
      background: rgba(0,0,0,0.3);
      color: #FFE680;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover { background: rgba(201,168,76,0.2); }

    /* ====== MAIN BODY LAYOUT ====== */
    #main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ====== LEFT SIDEBAR ====== */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--parchment);
      border-right: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-header {
      background: linear-gradient(135deg, var(--maroon), #B03030);
      color: white;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-family: 'Rozha One', serif;
      font-size: 0.9rem;
      color: #FFE680;
    }

    #site-count-badge {
      background: var(--gold);
      color: #2C1010;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
    }

    #sidebar-search {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(201,168,76,0.3);
      flex-shrink: 0;
    }

    #search-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: #FFF9EE;
      font-size: 12px;
      outline: none;
      font-family: 'Outfit', sans-serif;
    }

    #sites-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #sites-list::-webkit-scrollbar { width: 4px; }
    #sites-list::-webkit-scrollbar-track { background: #F5ECD7; }
    #sites-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

    .site-card {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 8px 9px;
      border-radius: 10px;
      border: 1px solid rgba(201,168,76,0.3);
      background: #FFFDF8;
      cursor: pointer;
      transition: all 0.18s;
    }

    .site-card:hover { background: #FFF3D0; border-color: var(--gold); transform: translateX(2px); }
    .site-card.active { background: linear-gradient(135deg, #FFF3D0, #FFE9A0); border-color: var(--maroon); border-width: 2px; }

    .site-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(201,168,76,0.4);
      background: #E8D8B0;
    }

    .site-card-info { flex: 1; min-width: 0; }

    .site-card-name {
      font-size: 12px;
      font-weight: 700;
      color: #2C1010;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .site-card-meta {
      font-size: 10px;
      color: #8B5E3C;
      margin-top: 2px;
    }

    .site-card-dist {
      font-size: 10px;
      font-weight: 700;
      color: var(--maroon);
      margin-top: 3px;
    }

    /* ====== MAP CONTAINER ====== */
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; }

    /* ====== STORY PANEL (RIGHT DRAWER) ====== */
    #story-panel {
      width: 0;
      min-width: 0;
      background: var(--cream);
      border-left: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: hidden;
      flex-shrink: 0;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    #story-panel.open {
      width: var(--story-width);
      min-width: var(--story-width);
      overflow-y: auto;
    }


    .story-img-header {
      position: relative;
      height: 200px;
      flex-shrink: 0;
      overflow: hidden;
    }

    #story-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(44,16,16,0.85) 100%);
    }

    .story-img-text {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 40px;
    }

    #story-site-name {
      font-family: 'Rozha One', serif;
      font-size: 1.1rem;
      color: #FFE680;
      line-height: 1.2;
    }

    #story-site-hindi {
      font-family: 'Yatra One', cursive;
      font-size: 0.75rem;
      color: rgba(255,230,160,0.8);
      margin-top: 2px;
    }

    .story-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .story-close-btn:hover { background: rgba(0,0,0,0.8); }

    /* Story badges */
    .story-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 12px 8px;
      border-bottom: 1px solid rgba(201,168,76,0.3);
      flex-shrink: 0;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      border: 1px solid;
    }

    .badge-cat { background: #FFF3D0; color: var(--maroon); border-color: var(--gold); }
    .badge-period { background: #F0F8FF; color: #2C4A8C; border-color: #6699CC; }
    .badge-dist { background: #F0FFF0; color: #1A5C2A; border-color: #4CAF50; }

    /* Action buttons */
    .story-actions {
      display: flex;
      gap: 7px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(201,168,76,0.3);
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-voice {
      background: linear-gradient(135deg, var(--maroon), #B03030);
      color: white;
    }

    .btn-voice:hover { opacity: 0.9; }
    .btn-voice.playing { background: linear-gradient(135deg, #1A5C2A, #2E7D32); }

    .btn-route {
      background: linear-gradient(135deg, #1A3A6C, #2C5FAA);
      color: white;
    }

    .btn-route:hover { opacity: 0.9; }

    /* Route info strip */
    #route-info {
      display: none;
      padding: 7px 12px;
      background: linear-gradient(90deg, #EAF4FF, #F0F8FF);
      border-bottom: 1px solid rgba(100,150,200,0.4);
      font-size: 11px;
      font-weight: 600;
      color: #1A3A6C;
      gap: 14px;
      align-items: center;
      flex-shrink: 0;
    }

    #route-info.visible { display: flex; }

    /* Story chapters */
    #story-chapters {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #story-chapters::-webkit-scrollbar { width: 4px; }
    #story-chapters::-webkit-scrollbar-track { background: var(--cream); }
    #story-chapters::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

    .story-chapter {
      background: #FFFDF5;
      border: 1px solid rgba(201,168,76,0.25);
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      padding: 10px 11px;
    }

    .chapter-heading {
      font-size: 11px;
      font-weight: 800;
      color: var(--maroon);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .chapter-content {
      font-size: 13px;
      color: #3C2A20;
      line-height: 1.65;
    }

    /* Loading state */
    #story-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 30px;
      color: var(--maroon);
      font-size: 13px;
    }

    #story-loading.visible { display: flex; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(123,30,30,0.2);
      border-top-color: var(--maroon);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ====== MAP PINS ====== */
    .custom-pin {
      width: 34px;
      height: 34px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      border: 2px solid #FFF;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .custom-pin:hover { transform: rotate(-45deg) scale(1.2); }
    .custom-pin span { transform: rotate(45deg); font-size: 14px; }
    .pin-monument { background: linear-gradient(135deg, #7B1E1E, #C9A84C); }
    .pin-user { background: linear-gradient(135deg, #0B3D7A, #1565C0); }

    /* ====== FESTIVALS MODAL ====== */
    #fest-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #fest-modal.open { display: flex; }

    .fest-modal-inner {
      background: var(--cream);
      border-radius: 16px;
      border: 2px solid var(--gold);
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .fest-modal-header {
      background: linear-gradient(90deg, #2C1010, #7B3020);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .fest-modal-header h3 {
      font-family: 'Rozha One', serif;
      font-size: 1.05rem;
      color: #FFE680;
    }

    .modal-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fest-list {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fest-card {
      background: #FFFBF0;
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 12px;
      padding: 12px 14px;
      border-left: 4px solid var(--gold);
    }

    .fest-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .fest-timing {
      font-size: 10px;
      font-weight: 700;
      color: #5C3A1A;
      background: #FFF3CC;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid var(--gold);
    }

    .fest-card-name { font-family: 'Rozha One', serif; font-size: 0.95rem; color: #2C1010; }
    .fest-card-hindi { font-family: 'Yatra One', cursive; font-size: 0.75rem; color: #7B3020; }
    .fest-card-desc { font-size: 12px; color: #3C2A20; margin-top: 5px; line-height: 1.55; }
    .fest-card-exp { font-size: 11px; color: #5C3A1A; font-weight: 600; margin-top: 4px; }

    /* Route polyline pulse */
    .route-line {
      stroke-dasharray: 10, 5;
      animation: dashMove 0.8s linear infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -15; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      #story-panel { width: 100vw; }
    }
  </style>
</head>

<body>
  <!-- ====== NAVBAR ====== -->
  <nav id="navbar">
    <div class="nav-brand">
      <div class="nav-logo">🪔</div>
      <div>
        <div class="nav-title">धरोहर सेतु</div>
        <div class="nav-subtitle">AI Cultural Heritage & Folk Radar</div>
      </div>
    </div>

    <div class="nav-center">
      <!-- Mode Pills -->
      <div class="mode-pill">
        <button class="mode-btn active" id="btn-nearby" onclick="setMode('nearby')">📍Nearby location</button>
        <button class="mode-btn" id="btn-state" onclick="setMode('state')">🏛️ Whole State</button>
      </div>
      <button class="fest-btn" onclick="openFestModal()">🪔 Lok-Utsav <span id="fest-badge" style="background:rgba(0,0,0,0.2);padding:0 4px;border-radius:6px;margin-left:2px;">0</span></button>
      <!-- State Dropdown -->
      <select id="state-select">
        <option value="Jammu and Kashmir">Jammu & Kashmir</option>
      </select>
    </div>

    <div class="nav-right">
      <button class="nav-btn" onclick="detectLocation()">📍 <span id="gps-label">Live GPS</span></button>
      <button class="nav-btn" onclick="toggleLang()">🌐 <span id="lang-label">हिन्दी</span></button>
    </div>
  </nav>

  <!-- ====== MAIN BODY ====== -->
  <div id="main-body">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>🏛️ Heritage Sites</h2>
        <span id="site-count-badge">0</span>
      </div>
      <div id="sidebar-search">
        <input type="text" id="search-input" placeholder="🔍 Search sites..." oninput="filterSidebar(this.value)" />
      </div>
      <div id="sites-list">
        <div style="text-align:center;padding:20px;color:#8B5E3C;font-size:12px;">स्थान लोड हो रहे हैं...</div>
      </div>
    </aside>

    <!-- MAP -->
    <div id="map-container">
      <div id="map"></div>
    </div>

    <!-- RIGHT STORY PANEL -->
    <div id="story-panel">
      <!-- Image Header -->
      <div class="story-img-header">
        <img id="story-img" src="" alt="Heritage Site" />
        <div class="story-img-overlay"></div>
        <div class="story-img-text">
          <div id="story-site-name">Heritage Site</div>
          <div id="story-site-hindi"></div>
        </div>
        <button class="story-close-btn" onclick="closeStoryPanel()">✕</button>
      </div>

      <!-- Badges -->
      <div class="story-badges">
        <span class="badge badge-cat" id="badge-cat">—</span>
        <span class="badge badge-period" id="badge-period">—</span>
        <span class="badge badge-dist" id="badge-dist">— km</span>
      </div>

      <!-- Action Buttons -->
      <div class="story-actions">
        <button class="action-btn btn-voice" id="btn-voice" onclick="toggleVoice()">
          <span id="voice-icon">▶️</span>
          <span id="voice-text">Folk-Tale</span>
        </button>
        <button class="action-btn btn-route" id="btn-route" onclick="drawRoute()">
          🗺️ Direction
        </button>
      </div>

      <!-- Route Info Strip -->
      <div id="route-info">
        <span>🚗 <b id="route-dist">—</b> km</span>
        <span>⏱️ <b id="route-time">—</b> min</span>
        <button onclick="clearRoute()" style="margin-left:auto;font-size:10px;color:#1A3A6C;background:none;border:none;cursor:pointer;font-weight:700;">✕ Route hatao</button>
      </div>

      <!-- Loading -->
      <div id="story-loading">
        <div class="spinner"></div>
        <span>Lok-Katha taiyor ho rahi hai...</span>
      </div>

      <!-- Chapters -->
      <div id="story-chapters"></div>
    </div>

  </div><!-- end main-body -->

  <!-- FESTIVALS MODAL -->
  <div id="fest-modal">
    <div class="fest-modal-inner">
      <div class="fest-modal-header">
        <div>
          <h3>🪔 <span id="fest-modal-title">State Folk Tale</span></h3>
          <div style="font-size:10px;color:rgba(255,220,100,0.7);margin-top:2px;">Paramparik tithi aur sanskritik mahatva</div>
        </div>
        <button class="modal-close" onclick="closeFestModal()">✕</button>
      </div>
      <div id="fest-list"></div>
    </div>
  </div>

  <script>
  // =====================================================
  // DharoharSetu v3.0 — Full Featured App
  // =====================================================

    const S = {
      lat: 32.5625, lng: 75.12,
      userLatLng: [32.5625, 75.12],
      state: "Jammu and Kashmir",
      mode: "nearby",
      lang: "hi",
      map: null,
      userMarker: null,
      markersLayer: null,
      routeLayer: null,
      sites: [],
      allSites: [],
      festivals: [],
      activeSite: null,
      speechUtterance: null,
      isPlaying: false
    };

  const STATE_BOUNDS = {
    "Jammu and Kashmir": { bounds: [[32.0,73.5],[36.0,80.5]], center: [33.9,76.0], zoom: 7 },
    "Bihar": { bounds: [[24.3,83.3],[27.5,88.3]], center: [25.6,85.5], zoom: 8 },
    "Rajasthan": { bounds: [[23.0,69.5],[30.2,78.3]], center: [26.6,74.0], zoom: 7 },
    "Madhya Pradesh": { bounds: [[21.0,74.0],[26.9,82.8]], center: [23.5,78.5], zoom: 7 },
    "Chhattisgarh": { bounds: [[17.8,80.2],[24.1,84.4]], center: [21.3,81.8], zoom: 7 },
    "Odisha": { bounds: [[17.8,81.4],[22.6,87.5]], center: [20.5,85.1], zoom: 7 },
    "Tamil Nadu": { bounds: [[8.0,76.2],[13.6,80.4]], center: [10.9,78.7], zoom: 7 },
    "Maharashtra": { bounds: [[15.6,72.6],[22.1,80.9]], center: [19.0,76.0], zoom: 7 },
    "Uttar Pradesh": { bounds: [[23.9,77.1],[30.4,84.7]], center: [26.8,80.9], zoom: 7 },
    "Gujarat": { bounds: [[20.1,68.2],[24.7,74.5]], center: [22.3,71.2], zoom: 7 }
  };

  // ---- Init ----
  document.addEventListener("DOMContentLoaded", async () => {
    initMap();
    await loadStates();
    setupStateDropdown();
    detectLocation();
  });

  function initMap() {
    S.map = L.map("map", { zoomControl: false }).setView([S.lat, S.lng], 10);
    L.control.zoom({ position: "bottomright" }).addTo(S.map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '© CARTO | DharoharSetu',
      maxZoom: 19
    }).addTo(S.map);

    S.markersLayer = L.layerGroup().addTo(S.map);
  }

  async function loadStates() {
    try {
      const res = await fetch("/api/states");
      const data = await res.json();
      const sel = document.getElementById("state-select");
      sel.innerHTML = "";
      data.states.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st; opt.textContent = st;
        if (st === S.state) opt.selected = true;
        sel.appendChild(opt);
      });
    } catch(e) { console.warn("Could not load states:", e); }
  }

  function setupStateDropdown() {
    document.getElementById("state-select").addEventListener("change", (e) => {
      S.state = e.target.value;
      const info = STATE_BOUNDS[S.state];
      if (info) { S.lat = info.center[0]; S.lng = info.center[1]; }
      setMode("state");
    });
  }

  // ---- Location ----
  async function detectLocation() {
    document.getElementById("gps-label").textContent = "Dhundh raha...";
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => { S.lat = pos.coords.latitude; S.lng = pos.coords.longitude; document.getElementById("gps-label").textContent = "GPS ✓"; onLocation(); },
        () => ipFallback(),
        { timeout: 4000 }
      );
    } else { ipFallback(); }
  }

  async function ipFallback() {
    try {
      const r = await fetch("/api/location/auto-ip");
      const d = await r.json();
      if (d.latitude) { S.lat = d.latitude; S.lng = d.longitude; S.state = d.state || S.state; syncDdl(d.state); }
    } catch(e) {}
    document.getElementById("gps-label").textContent = "Located ✓";
    onLocation();
  }

  function syncDdl(stateName) {
    if (!stateName) return;
    const sel = document.getElementById("state-select");
    for (let o of sel.options) {
      if (o.value.toLowerCase().includes(stateName.toLowerCase()) || stateName.toLowerCase().includes(o.value.toLowerCase())) {
        sel.value = o.value; S.state = o.value; break;
      }
    }
  }

  function onLocation() {
    updateUserMarker();
    // Default: show all state sites (not just 150km radius)
    S.mode = "state";
    document.getElementById("btn-nearby").classList.remove("active");
    document.getElementById("btn-state").classList.add("active");
    const info = STATE_BOUNDS[S.state];
    if (info) S.map.fitBounds(info.bounds, { padding: [30, 30], duration: 1.2 });
    loadData();
  }

  function updateUserMarker() {
    if (S.userMarker) S.map.removeLayer(S.userMarker);
    const icon = L.divIcon({
      className: "",
      html: `<div class="custom-pin pin-user"><span>📍</span></div>`,
      iconSize: [34,34], iconAnchor: [17,34]
    });
    S.userMarker = L.marker([S.lat, S.lng], { icon }).addTo(S.map).bindPopup("<b>Aapka Sthaan</b>");
    S.map.flyTo([S.lat, S.lng], 10, { duration: 1 });
  }

  // ---- Mode ----
  function setMode(mode) {
    S.mode = mode;
    document.getElementById("btn-nearby").classList.toggle("active", mode === "nearby");
    document.getElementById("btn-state").classList.toggle("active", mode === "state");

    if (mode === "state") {
      const info = STATE_BOUNDS[S.state];
      if (info) S.map.fitBounds(info.bounds, { padding: [30,30], duration: 1.2 });
    } else {
      S.map.flyTo([S.lat, S.lng], 10, { duration: 1 });
    }

    loadData();
  }

  // ---- Load Data ----
  async function loadData() {
    try {
      const [siteRes, festRes] = await Promise.all([
        fetch(`/api/sites?lat=${S.lat}&lng=${S.lng}&mode=${S.mode}&state=${encodeURIComponent(S.state)}`),
        fetch(`/api/festivals?state=${encodeURIComponent(S.state)}`)
      ]);

      const siteData = await siteRes.json();
      const festData = await festRes.json();

      S.allSites = siteData.sites;
      S.sites = [...S.allSites];
      S.festivals = festData.festivals;

      document.getElementById("site-count-badge").textContent = S.sites.length;
      document.getElementById("fest-badge").textContent = S.festivals.length;

      renderSidebar(S.sites);
      renderMapMarkers(S.sites);
    } catch(e) {
      console.error("Load data error:", e);
    }
  }

  // ---- Sidebar ----
  function renderSidebar(sites) {
    const el = document.getElementById("sites-list");
    if (!sites.length) {
      el.innerHTML = `<div style="text-align:center;padding:20px;color:#8B5E3C;font-size:12px;">इस क्षेत्र में कोई स्थल नहीं मिला।</div>`;
      return;
    }

    el.innerHTML = sites.map(site => `
      <div class="site-card ${S.activeSite?.id === site.id ? 'active' : ''}" 
           id="card-${site.id}" onclick="selectSite('${site.id}')">
        <img class="site-thumb" src="${site.image_url}" alt="${site.name}" 
             onerror="this.src='https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=200&q=60'" />
        <div class="site-card-info">
          <div class="site-card-name">${site.name}</div>
          <div class="site-card-meta">${site.district} · ${site.category}</div>
          <div class="site-card-dist">📍 ${site.distance_km} km</div>
        </div>
      </div>
    `).join("");
  }

  function filterSidebar(q) {
    if (!q.trim()) { S.sites = [...S.allSites]; }
    else {
      const lower = q.toLowerCase();
      S.sites = S.allSites.filter(s =>
        s.name.toLowerCase().includes(lower) ||
        s.district.toLowerCase().includes(lower) ||
        s.category.toLowerCase().includes(lower)
      );
    }
    renderSidebar(S.sites);
  }

  // ---- Map Markers ----
  function renderMapMarkers(sites) {
    S.markersLayer.clearLayers();
    sites.forEach(site => {
      const icon = L.divIcon({
        className: "",
        html: `<div class="custom-pin pin-monument"><span>🏛️</span></div>`,
        iconSize: [34,34], iconAnchor: [17,34]
      });
      const marker = L.marker([site.lat, site.lng], { icon })
        .bindTooltip(`<b>${site.name}</b><br><small>${site.district} · ${site.distance_km} km</small>`, { direction: "top" });
      marker.on("click", () => selectSite(site.id));
      S.markersLayer.addLayer(marker);
    });
  }

  // ---- Select Site ----
  async function selectSite(siteId) {
    const site = S.allSites.find(s => s.id === siteId);
    if (!site) return;

    S.activeSite = site;
    stopVoice();
    clearRoute();

    // Update sidebar active state
    document.querySelectorAll(".site-card").forEach(c => c.classList.remove("active"));
    const card = document.getElementById(`card-${siteId}`);
    if (card) { card.classList.add("active"); card.scrollIntoView({ block: "nearest", behavior: "smooth" }); }

    // Fly map to site
    S.map.flyTo([site.lat, site.lng], 14, { duration: 1.1 });

    // Open story panel
    openStoryPanel(site);

    // Load story
    loadStory(siteId);
  }

  function openStoryPanel(site) {
    document.getElementById("story-img").src = site.image_url;
    document.getElementById("story-img").onerror = function() {
      this.src = "https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=800&q=80";
    };
    document.getElementById("story-site-name").textContent = site.name;
    document.getElementById("story-site-hindi").textContent = site.hindi_name || "";
    document.getElementById("badge-cat").textContent = site.category;
    document.getElementById("badge-period").textContent = site.period;
    document.getElementById("badge-dist").textContent = `${site.distance_km} km away`;
    document.getElementById("story-chapters").innerHTML = "";
    document.getElementById("story-panel").classList.add("open");
  }

  function closeStoryPanel() {
    document.getElementById("story-panel").classList.remove("open");
    stopVoice();
    clearRoute();
    S.activeSite = null;
    document.querySelectorAll(".site-card").forEach(c => c.classList.remove("active"));
  }

  async function loadStory(siteId) {
    document.getElementById("story-loading").classList.add("visible");
    document.getElementById("story-chapters").innerHTML = "";

    try {
      const res = await fetch(`/api/storyteller?site_id=${siteId}&lang=${S.lang}`);
      const data = await res.json();

      document.getElementById("story-loading").classList.remove("visible");

      if (data.error) {
        document.getElementById("story-chapters").innerHTML = `<p style="color:red;padding:10px;">Error: ${data.error}</p>`;
        return;
      }

      const chaptersEl = document.getElementById("story-chapters");
      chaptersEl.innerHTML = data.story_chapters.map(ch => `
        <div class="story-chapter">
          <div class="chapter-heading">${ch.heading}</div>
          <div class="chapter-content">${ch.content}</div>
        </div>
      `).join("");

      // Store speech text
      S.activeSite._speechText = data.speech_narration;

    } catch(e) {
      document.getElementById("story-loading").classList.remove("visible");
      document.getElementById("story-chapters").innerHTML = `<p style="color:#8B5E3C;padding:10px;font-size:12px;">Story load karne mein samasya aayi. Dobara try karein.</p>`;
    }
  }

  // ---- Voice Narration ----
  function toggleVoice() {
    if (S.isPlaying) { stopVoice(); return; }

    const site = S.activeSite;
    if (!site) return;

    const text = site._speechText ||
      (S.lang === "hi"
        ? `नमस्कार! आप ${site.hindi_name || site.name} के बारे में सुन रहे हैं। ${site.description} यहाँ की एक प्राचीन लोक-कथा है कि ${site.folklore_secret}`
        : `Greetings! You are exploring ${site.name}. ${site.description} Local folklore says: ${site.folklore_secret}`);

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = S.lang === "hi" ? "hi-IN" : "en-IN";
      utt.rate = 0.92;
      utt.pitch = 1.0;
      utt.onstart = () => {
        S.isPlaying = true;
        document.getElementById("voice-icon").textContent = "⏸️";
        document.getElementById("voice-text").textContent = "Roko (Pause)";
        document.getElementById("btn-voice").classList.add("playing");
      };
      utt.onend = utt.onerror = () => stopVoice();
      S.speechUtterance = utt;
      window.speechSynthesis.speak(utt);
    }
  }

  function stopVoice() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    S.isPlaying = false;
    document.getElementById("voice-icon").textContent = "▶️";
    document.getElementById("voice-text").textContent = "Lok-Katha Suniye";
    document.getElementById("btn-voice").classList.remove("playing");
  }

  // ---- In-App OSRM Routing ----
  async function drawRoute() {
    const site = S.activeSite;
    if (!site) return;

    const btn = document.getElementById("btn-route");
    btn.textContent = "⏳ Raasta dhundh raha...";
    btn.disabled = true;

    try {
      const res = await fetch(`/api/route?from_lat=${S.lat}&from_lng=${S.lng}&to_lat=${site.lat}&to_lng=${site.lng}`);
      const data = await res.json();

      if (data.status !== "ok") throw new Error("Route not found");

      // Clear old route
      clearRoute();

      // Draw route polyline on map
      const latlngs = data.coordinates.map(c => [c[1], c[0]]); // OSRM gives [lng,lat], Leaflet needs [lat,lng]

      S.routeLayer = L.polyline(latlngs, {
        color: "#1A3A6C",
        weight: 5,
        opacity: 0.85,
        dashArray: "10, 6",
        lineCap: "round"
      }).addTo(S.map);

      // Fit map to route
      S.map.fitBounds(S.routeLayer.getBounds(), { padding: [40, 40] });

      // Show info strip
      document.getElementById("route-dist").textContent = data.distance_km;
      document.getElementById("route-time").textContent = data.duration_minutes;
      document.getElementById("route-info").classList.add("visible");

    } catch(e) {
      alert("Raasta nahi mila. Please check connection.");
    }

    btn.innerHTML = "🗺️ Raasta Dikhao";
    btn.disabled = false;
  }

  function clearRoute() {
    if (S.routeLayer) {
      S.map.removeLayer(S.routeLayer);
      S.routeLayer = null;
    }
    document.getElementById("route-info").classList.remove("visible");
  }

  // ---- Festivals Modal ----
  function openFestModal() {
    document.getElementById("fest-modal-title").textContent = `${S.state} Ke Lok-Utsav`;
    const list = document.getElementById("fest-list");
    list.innerHTML = S.festivals.map(f => `
      <div class="fest-card">
        <div class="fest-card-top">
          <span class="fest-timing">🗓️ ${f.season_month} · ${f.traditional_timing}</span>
        </div>
        <div class="fest-card-name">${f.name}</div>
        <div class="fest-card-hindi">${f.hindi_name}</div>
        <div class="fest-card-desc">${f.cultural_significance}</div>
        <div class="fest-card-exp">✦ Zaroor Dekhein: ${f.must_experience}</div>
      </div>
    `).join("");
    document.getElementById("fest-modal").classList.add("open");
  }

  function closeFestModal() { document.getElementById("fest-modal").classList.remove("open"); }

  // Close modal on outside click
  document.getElementById("fest-modal").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closeFestModal();
  });

  // ---- Language Toggle ----
  function toggleLang() {
    S.lang = S.lang === "hi" ? "en" : "hi";
    document.getElementById("lang-label").textContent = S.lang === "hi" ? "हिन्दी" : "English";
    // Reload story in new language if panel is open
    if (S.activeSite) loadStory(S.activeSite.id);
  }
  </script>
</body>
</html>
